name: Detect upstream Kafka updates

# Opens/refreshes a PR bumping snapcraft.yaml when a newer Kafka version for this track lands in central-uploader.

env:
  BASE_BRANCH: 4/edge
  UPDATE_BRANCH: bot/update-kafka-version

on:
  workflow_dispatch:
  schedule:
    - cron: '00 16 * * *'

jobs:
  check:
    name: Check if a Kafka update is available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - id: get-current-version
        name: Retrieve packaged version
        run: |
          VERSION=$(yq '(.version|split("-"))[0]' snap/snapcraft.yaml)
          TRACK=${VERSION%%.*}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"

      - id: check-latest-version
        name: Check latest version on central-uploader
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK: ${{ steps.get-current-version.outputs.track }}
          CURRENT: ${{ steps.get-current-version.outputs.version }}
        run: |
          # Newest x.y.z among central-uploader tags "kafka_2.13-<track>.*-ubuntu*".
          LATEST=$(gh api --paginate \
            repos/canonical/central-uploader/releases \
            --jq '.[].tag_name' \
            | sed -n "s/^kafka_2\.13-\(${TRACK}\.[0-9]*\.[0-9]*\)-ubuntu[0-9]*$/\1/p" \
            | sort -V | tail -n1)

          echo "Current: ${CURRENT}, latest available: ${LATEST}"
          if [ -n "${LATEST}" ] && [ "${LATEST}" != "${CURRENT}" ] \
             && [ "$(printf '%s\n%s\n' "${CURRENT}" "${LATEST}" | sort -V | tail -n1)" = "${LATEST}" ]; then
            echo "decision=1" >> "$GITHUB_OUTPUT"
          else
            echo "decision=0" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
    outputs:
      decision: ${{ steps.check-latest-version.outputs.decision }}
      latest: ${{ steps.check-latest-version.outputs.latest }}
      current: ${{ steps.get-current-version.outputs.version }}

  create-or-update-pull-request:
    name: Create or update pull request
    if: needs.check.outputs.decision == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
    steps:
      - id: checkout
        name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}

      - id: record_latest_version
        name: Record updated Kafka version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${UPDATE_BRANCH}"

          current="${{ needs.check.outputs.current }}"
          latest="${{ needs.check.outputs.latest }}"
          sed -i "/^version:/s/${current}/${latest}/" snap/snapcraft.yaml
          git add ./snap/snapcraft.yaml
          git commit -m "chore: update Kafka to ${{ needs.check.outputs.latest }}"
          git push --set-upstream -f origin "${UPDATE_BRANCH}"

      - id: check
        name: Check if a PR already exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list \
            --json baseRefName,headRefName \
            --jq '
              map(select(.baseRefName == "${{ env.BASE_BRANCH }}" and .headRefName == "${{ env.UPDATE_BRANCH }}"))
              | length
            ')
          if ((prs > 0)); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: '!steps.check.outputs.skip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          gh pr create \
            --title "chore: update snap for Kafka ${LATEST}" \
            --body "Bump the packaged Apache Kafka version to ${LATEST}." \
            --base "${BASE_BRANCH}" \
            --label "automated pr"
