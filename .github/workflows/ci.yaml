name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install poetry
        run: pipx install poetry
      - name: Lint
        run: |
          sudo snap install just --classic
          just lint

  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v52.0.0

  test:
    name: Test snap
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download snap package
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Install snap
        run: sudo snap install ./kafka*.snap --dangerous

      - name: Connect interfaces
        run: |
          sudo snap connect kafka:mount-observe || true
          sudo snap connect kafka:removable-media || true
          sudo snap connect kafka:home || true

      - name: Start broker
        run: |
          sudo snap start kafka.server
          # The server formats KRaft storage on first start, then answers the protocol; wait for it.
          for _ in $(seq 60); do
            if sudo snap run kafka.kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "waiting for kafka to be ready..."
            sleep 5
          done
          if [ -z "${ready:-}" ]; then
            echo "kafka broker did not come up" >&2
            sudo snap logs kafka.server -n all >&2
            exit 1
          fi

      - name: Install poetry
        run: pipx install poetry

      - name: Smoke test
        run: |
          sudo snap install just --classic
          just smoke

      - name: Config test
        run: just config

      - name: Broker logs on failure
        if: failure()
        run: sudo snap logs kafka.server -n all

  cluster:
    name: Cluster test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download snap package
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      # Hosted runners cannot nest KVM, so the 3-node test runs in LXD containers rather than VMs.
      - name: Set up LXD
        uses: canonical/setup-lxd@main

      - name: Install poetry
        run: pipx install poetry

      - name: Cluster test
        run: |
          sudo snap install just --classic
          TYPE=container just cluster
