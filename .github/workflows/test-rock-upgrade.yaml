name: Test rock upgrade

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix of the artifact(s) holding the packed rock
        type: string
        default: packed-rock

# The image the cluster is first brought up on, then rolled off of, and a shared
# cluster id so the rock nodes rejoin the storage the upstream image formatted.
env:
  UPGRADE_FROM_IMAGE: apache/kafka:4.0.0
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

jobs:
  test-rock-upgrade:
    name: Rock rolling upgrade test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # for rockcraft.skopeo, which the rock is handed to docker with
      - name: Install rockcraft
        run: sudo snap install rockcraft --classic

      - name: Download rock package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Load the rock into the docker daemon
        run: |
          rock="$(find . -name '*.rock' -print -quit)"
          if [ -z "${rock}" ]; then
            echo "No .rock file among the downloaded artifacts" >&2
            exit 1
          fi
          echo "Loading ${rock}"

          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${rock}" docker-daemon:kafka:test

      - name: Write the readiness helper
        run: |
          cat > "${RUNNER_TEMP}/wait-for-broker.sh" <<'EOF'
          #!/usr/bin/env bash
          # Waits for the broker in <container> to answer the protocol on 9092.
          set -uo pipefail
          container="$1"

          for _ in $(seq 1 60); do
            if docker exec "${container}" \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "${container} is up"
              exit 0
            fi
            echo "Waiting for ${container} to be ready..."
            sleep 5
          done

          echo "Timed out waiting for ${container}" >&2
          exit 1
          EOF
          chmod +x "${RUNNER_TEMP}/wait-for-broker.sh"

      # Every node is started, and later restarted, through the same call: the
      # only thing that changes across the upgrade is the image passed to it.
      - name: Write the node start helper
        run: |
          cat > "${RUNNER_TEMP}/start-node.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          id="$1"
          image="$2"

          docker run -d --name "kafka${id}" --network kafka-net \
            -v "kafka-data${id}:/var/lib/kafka/data" \
            -e CLUSTER_ID \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR=3 \
            -e KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR=2 \
            -e KAFKA_LOG_DIRS=/var/lib/kafka/data \
            -e KAFKA_NODE_ID="${id}" \
            -e KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://kafka${id}:9092" \
            "${image}"
          EOF
          chmod +x "${RUNNER_TEMP}/start-node.sh"

      - name: Create the network and per-node data volumes
        run: |
          docker network create kafka-net
          docker volume create kafka-data1
          docker volume create kafka-data2
          docker volume create kafka-data3

      - name: Start a three node cluster on the upstream image
        run: |
          for id in 1 2 3; do
            bash "${RUNNER_TEMP}/start-node.sh" "${id}" "${UPGRADE_FROM_IMAGE}"
          done

      - name: Wait for the cluster to be up
        run: |
          for id in 1 2 3; do
            bash "${RUNNER_TEMP}/wait-for-broker.sh" "kafka${id}"
          done

      - name: Write initial data before the upgrade
        run: |
          docker exec kafka1 /opt/kafka/bin/kafka-topics.sh \
            --create --topic upgrade --partitions 3 --replication-factor 3 \
            --bootstrap-server kafka1:9092

          echo "hello-pre-upgrade" | docker exec -i kafka1 /opt/kafka/bin/kafka-console-producer.sh \
            --topic upgrade --bootstrap-server kafka1:9092

          # Read on a different node, so a message that comes back is one that
          # was actually replicated rather than one node's local copy.
          result="$(docker exec kafka3 /opt/kafka/bin/kafka-console-consumer.sh \
            --topic upgrade --from-beginning --max-messages 1 \
            --timeout-ms 30000 --bootstrap-server kafka3:9092)"
          echo "${result}"
          echo "${result}" | grep -q hello-pre-upgrade

      # Each node is stopped, removed and restarted under the same name against
      # its own data volume, with the rock replacing the upstream image but every
      # other flag left exactly as it was at first start.
      - name: Roll each node onto the rock
        run: |
          for id in 1 2 3; do
            docker stop "kafka${id}"
            docker rm "kafka${id}"
            bash "${RUNNER_TEMP}/start-node.sh" "${id}" kafka:test
            bash "${RUNNER_TEMP}/wait-for-broker.sh" "kafka${id}"
          done

      - name: Check the pre-upgrade data survived
        run: |
          result="$(docker exec kafka2 /opt/kafka/bin/kafka-console-consumer.sh \
            --topic upgrade --from-beginning --max-messages 1 \
            --timeout-ms 30000 --bootstrap-server kafka2:9092)"
          echo "${result}"
          echo "${result}" | grep -q hello-pre-upgrade

      - name: Write and read back new data on the upgraded cluster
        run: |
          echo "hello-post-upgrade" | docker exec -i kafka1 /opt/kafka/bin/kafka-console-producer.sh \
            --topic upgrade --bootstrap-server kafka1:9092

          result="$(docker exec kafka3 /opt/kafka/bin/kafka-console-consumer.sh \
            --topic upgrade --from-beginning --max-messages 2 \
            --timeout-ms 30000 --bootstrap-server kafka3:9092)"
          echo "${result}"
          echo "${result}" | grep -q hello-post-upgrade

      - name: Dump the container logs
        if: failure()
        run: |
          for container in $(docker ps --all --format '{{.Names}}'); do
            echo "::group::docker logs ${container}"
            docker logs "${container}" 2>&1 || true
            echo "::endgroup::"
          done
