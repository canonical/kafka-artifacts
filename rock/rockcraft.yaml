name: kafka
base: ubuntu@26.04

version: '4.3.1'

summary: Rock for Apache Kafka – the distributed event streaming platform
description: |
  This rock provides Apache Kafka, a distributed event streaming platform.

  It is built from the same binaries as the kafka snap in this repository,
  and laid out like the official Apache Kafka image: the same paths, the same
  appuser account, and the same KAFKA_* environment variables translated into
  server.properties by kafka.docker.KafkaDockerWrapper.

license: Apache-2.0

platforms:
  amd64:
  arm64:

environment:
  JAVA_HOME: /opt/java/openjdk
  KAFKA_HOME: /opt/kafka
  # Console logging is the container default, so LOG_DIR only holds GC logs; keep
  # it off the read-only /opt/kafka tree and on a path appuser owns.
  LOG_DIR: /var/log/kafka
  LANG: C.UTF-8
  # Pebble keeps the output of its services to itself unless it is run with
  # "--verbose", of which this is the documented environment form. Without it
  # "docker logs" shows Pebble's own handful of lines and nothing from the broker.
  PEBBLE_VERBOSE: "1"
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/java/openjdk/bin:/opt/kafka/bin

services:
  kafka:
    override: replace
    startup: enabled
    # The arguments in brackets become the image's CMD, so "docker run <image>"
    # starts a broker and "docker run <image> KAFKA_NODE_ID=2" reaches Kafka.
    command: /usr/local/bin/docker-entrypoint.sh [ ]
    user: appuser
    group: appuser
    working-dir: /var/lib/kafka/data
    on-success: shutdown
    on-failure: shutdown

entrypoint-service: kafka

checks:
  broker:
    override: replace
    level: ready
    period: 10s
    timeout: 3s
    threshold: 3
    tcp:
      port: 9092

parts:
  # The account the official image runs as, with the uid and gid it uses.
  user:
    plugin: nil
    overlay-script: |
      # ubuntu@26.04 ships a default "ubuntu" user at uid/gid 1000, where the
      # official image keeps appuser; a data volume shared across an upgrade
      # needs the two to agree, so reclaim 1000 before creating appuser.
      userdel --root "${CRAFT_OVERLAY}" --remove ubuntu 2>/dev/null || true
      groupdel --root "${CRAFT_OVERLAY}" ubuntu 2>/dev/null || true
      groupadd --root "${CRAFT_OVERLAY}" -g 1000 appuser
      useradd --root "${CRAFT_OVERLAY}" -g appuser -u 1000 \
        --home-dir /home/appuser --create-home --shell /bin/bash appuser

  dependencies:
    plugin: nil
    stage-packages:
      # "free" and "ps", which the kafka start scripts size the heap with
      - procps
      # for kafka clients to verify the certificate of a TLS-enabled broker
      - ca-certificates

  java-runtime:
    plugin: nil
    build-packages:
      - openjdk-21-jdk-headless
      - ca-certificates-java
    override-build: |
      # A minimal runtime holding only the modules Kafka needs, matching the
      # module set jlinked into the kafka snap in this repository.
      modules="java.base,java.compiler,java.desktop,java.instrument"
      modules="${modules},java.management,java.management.rmi,java.naming"
      modules="${modules},java.rmi,java.scripting,java.security.jgss"
      modules="${modules},java.security.sasl,java.sql,java.xml"
      modules="${modules},jdk.attach,jdk.crypto.cryptoki,jdk.crypto.ec"
      modules="${modules},jdk.jfr,jdk.management,jdk.management.agent"
      modules="${modules},jdk.naming.dns,jdk.naming.rmi,jdk.net"
      modules="${modules},jdk.security.auth,jdk.security.jgss"
      modules="${modules},jdk.unsupported,jdk.zipfs"

      # /opt/java/openjdk is where the official image keeps its runtime, and
      # what JAVA_HOME points at above.
      jlink \
        --add-modules "${modules}" \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output "${CRAFT_PART_INSTALL}/opt/java/openjdk"

      # jlink does not follow the JDK's lib/security/cacerts symlink, so replace
      # the empty bundle it generated with the distro trust store.
      update-ca-certificates -f
      test -s /etc/ssl/certs/java/cacerts
      cp /etc/ssl/certs/java/cacerts \
        "${CRAFT_PART_INSTALL}/opt/java/openjdk/lib/security/cacerts"
    stage:
      - opt/java/openjdk

  kafka:
    plugin: nil
    after: [java-runtime]
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      craftctl default
      version="$(craftctl get version)"

      # central-uploader tags releases apache-kafka_2.13-<ver>-ubuntu<N>, each
      # with one .tar.gz; resolve its URL, the same source as the kafka snap.
      for patch in ubuntu2 ubuntu1 ubuntu0; do
        tag="apache-kafka_2.13-${version}-${patch}"
        api="https://api.github.com/repos/canonical/central-uploader/releases/tags/${tag}"
        url="$(curl -fsSL "${api}" 2>/dev/null \
          | grep -oE '"browser_download_url": *"[^"]+\.tar.gz"' \
          | head -n1 | cut -d'"' -f4 || true)"
        [ -n "${url}" ] && break
      done
      if [ -z "${url}" ]; then
        echo "no central-uploader release found for Kafka ${version}" >&2
        exit 1
      fi
      curl -fL -o apache-kafka.tar.gz "${url}"

      mkdir -p "${CRAFT_PART_INSTALL}/opt/kafka"
      tar -xzf apache-kafka.tar.gz -C "${CRAFT_PART_INSTALL}/opt/kafka" --strip-components=1
      rm -f apache-kafka.tar.gz

      # The site-docs tree and Windows scripts are of no use inside the rock.
      rm -rf "${CRAFT_PART_INSTALL}/opt/kafka/site-docs"
      rm -rf "${CRAFT_PART_INSTALL}/opt/kafka/bin/windows"
      find "${CRAFT_PART_INSTALL}/opt/kafka/bin/" -name '*.sh' -exec chmod a+x {} +

      # KafkaDockerWrapper reads the log4j configs from its --default-configs-dir
      # alongside the server.properties template shipped under rock/local. The
      # official image seeds them from the distribution's own config the same way.
      mkdir -p "${CRAFT_PART_INSTALL}/etc/kafka/docker"
      cp "${CRAFT_PART_INSTALL}/opt/kafka/config/log4j2.yaml" \
         "${CRAFT_PART_INSTALL}/etc/kafka/docker/log4j2.yaml"
      cp "${CRAFT_PART_INSTALL}/opt/kafka/config/tools-log4j2.yaml" \
         "${CRAFT_PART_INSTALL}/etc/kafka/docker/tools-log4j2.yaml"

      # The runtime directories the broker owns: data (log.dirs), GC logs,
      # TLS material, and the mount point for user-supplied config overrides.
      mkdir -p "${CRAFT_PART_INSTALL}/var/lib/kafka/data" \
               "${CRAFT_PART_INSTALL}/var/log/kafka" \
               "${CRAFT_PART_INSTALL}/etc/kafka/secrets" \
               "${CRAFT_PART_INSTALL}/mnt/shared/config"
    permissions:
      # KafkaDockerWrapper writes the rendered server.properties back into the
      # config directory, so appuser has to own it.
      - path: opt/kafka/config
        owner: 1000
        group: 1000
      - path: opt/kafka/config/*
        owner: 1000
        group: 1000
      - path: var/lib/kafka/data
        owner: 1000
        group: 1000
        mode: "750"
      - path: var/log/kafka
        owner: 1000
        group: 1000
        mode: "750"
      - path: etc/kafka/secrets
        owner: 1000
        group: 1000
        mode: "700"
      - path: mnt/shared/config
        owner: 1000
        group: 1000

  entrypoint:
    plugin: dump
    source: local
