parts:
  # setpriv (util-linux): the daemon wrappers use it to drop to the _daemon_ user.
  dependencies:
    plugin: nil
    stage-packages:
      - util-linux
      - ca-certificates

  # Minimal jlinked OpenJDK 21 (only the modules Kafka needs) at the arch-independent usr/lib/jvm/java-slim.
  java-runtime:
    plugin: nil
    build-packages:
      - openjdk-21-jdk-headless
      - ca-certificates-java
    override-build: |
      # Modules Kafka needs: java.base, JMX, SASL/GSSAPI/Kerberos, TLS+XML crypto, jdk.unsupported (sun.misc.Unsafe).
      modules="java.base,java.compiler,java.desktop,java.instrument"
      modules="${modules},java.management,java.management.rmi,java.naming"
      modules="${modules},java.rmi,java.scripting,java.security.jgss"
      modules="${modules},java.security.sasl,java.sql,java.xml"
      modules="${modules},jdk.attach,jdk.crypto.cryptoki,jdk.crypto.ec"
      modules="${modules},jdk.jfr,jdk.management,jdk.management.agent"
      modules="${modules},jdk.naming.dns,jdk.naming.rmi,jdk.net"
      modules="${modules},jdk.security.auth,jdk.security.jgss"
      modules="${modules},jdk.unsupported,jdk.zipfs"

      jlink \
        --add-modules "${modules}" \
        --strip-debug \
        --no-man-pages \
        --no-header-files \
        --compress=zip-6 \
        --output "${CRAFT_PART_INSTALL}/usr/lib/jvm/java-slim"

      # jlink does not follow the cacerts symlink, so replace its empty bundle with the distro trust store.
      update-ca-certificates -f
      test -s /etc/ssl/certs/java/cacerts
      cp /etc/ssl/certs/java/cacerts \
        "${CRAFT_PART_INSTALL}/usr/lib/jvm/java-slim/lib/security/cacerts"
    stage:
      - usr/lib/jvm/java-slim

  # Upstream Apache Kafka under opt/kafka; tarball URL resolved from central-uploader at build time.
  kafka:
    plugin: nil
    after: [java-runtime]
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      craftctl default
      version="$(craftctl get version)"
      # central-uploader tags releases apache-kafka_2.13-<ver>-ubuntu<N>, each with one .tar.gz; resolve its URL.
      for patch in ubuntu2 ubuntu1 ubuntu0; do
        tag="apache-kafka_2.13-${version}-${patch}"
        api="https://api.github.com/repos/canonical/central-uploader/releases/tags/${tag}"
        url="$(curl -fsSL "${api}" 2>/dev/null \
          | grep -oE '"browser_download_url": *"[^"]+\.tar.gz"' \
          | head -n1 | cut -d'"' -f4 || true)"
        [ -n "${url}" ] && break
      done
      if [ -z "${url}" ]; then
        echo "no central-uploader release found for Kafka ${version}" >&2
        exit 1
      fi
      curl -fL -o apache-kafka.tar.gz "${url}"

      mkdir -p "${CRAFT_PART_INSTALL}/opt/kafka"
      tar -xzf apache-kafka.tar.gz -C "${CRAFT_PART_INSTALL}/opt/kafka" --strip-components=1
      rm -f apache-kafka.tar.gz

      # The site_docs/ tree and Windows scripts are of no use inside the snap.
      rm -rf "${CRAFT_PART_INSTALL}/opt/kafka/site-docs"
      rm -rf "${CRAFT_PART_INSTALL}/opt/kafka/bin/windows"
      find "${CRAFT_PART_INSTALL}/opt/kafka/bin/" -name '*.sh' -exec chmod a+x {} +

  # Local wrappers, shared helper scripts and hooks.
  wrapper:
    plugin: dump
    source: snap/local
