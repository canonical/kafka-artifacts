name: kafka
base: core26
version: '4.3.1'

summary: Apache Kafka in a snap.
description: |
  A standalone snap for Apache Kafka, a distributed event streaming
  platform.

grade: stable
confinement: strict

# The headless java-slim runtime is jlinked without the X11/desktop/sound modules, so the
# library linter's missing/unused-dependency warnings for its .so files are expected noise.
lint:
  ignore:
    - library:
        - usr/lib/jvm/java-slim/**

title: Apache Kafka
website: https://kafka.apache.org
contact: https://github.com/canonical/kafka-snap/issues
issues: https://github.com/canonical/kafka-snap/issues
source-code: https://github.com/canonical/kafka-snap
license: Apache-2.0

platforms:
  amd64:
  arm64:

system-usernames:
  _daemon_: shared

environment:
  # java-slim: arch-independent symlink to the bundled OpenJDK 21 JRE, so JAVA_HOME need not name an arch.
  JAVA_HOME: ${SNAP}/usr/lib/jvm/java-slim
  KAFKA_HOME: ${SNAP}/opt/kafka
  PATH: ${SNAP}/opt/kafka/bin:${SNAP}/usr/lib/jvm/java-slim/bin:${SNAP}/usr/bin:${PATH}

slots:
  # Optional: lets a companion snap read the broker logs over a content interface.
  logs:
    interface: content
    source:
      read:
        - $SNAP_COMMON/var/log/kafka

hooks:
  install:
    plugs:
      - network
      - network-bind
      - mount-observe
  configure:
    plugs:
      - network
      - network-bind
      - mount-observe

apps:
  # kafka-server-start/stop.sh are NOT tools: the "server" daemon owns the broker lifecycle (install-mode: enable).
  server:
    command: opt/kafka/bin/start-wrapper.bash
    daemon: simple
    install-mode: enable
    aliases:
      - kafka-server
    plugs:
      - network
      - network-bind
      - mount-observe
      - removable-media
    environment:
      LOG_DIR: $SNAP_COMMON/var/log/kafka

  # Broker tools: every upstream bin/*.sh, aliased to its basename (".sh" stripped), run through bin-wrapper.bash.
  kafka-acls:
    command: opt/kafka/bin/bin-wrapper.bash
    aliases:
      - kafka-acls
    plugs:
      - network
      - network-bind
      - mount-observe
      - home
    environment:
      bin_script: kafka-acls.sh
  kafka-broker-api-versions:
